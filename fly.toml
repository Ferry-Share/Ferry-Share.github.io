# Alternative relay host. `fly launch --no-deploy` then `fly deploy`.
#
# Built from the repository Dockerfile, which installs production dependencies
# only — that is `ws` and nothing else. The previous heroku/builder setting
# started the app with `npm start`, which on a buildpack image has no `./out`
# to serve and exited immediately.
app = "ferry-relay"
primary_region = "sin"

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "8081"

[http_service]
  internal_port = 8081
  force_https = true
  auto_stop_machines = "suspend"
  auto_start_machines = true
  min_machines_running = 0

[[http_service.checks]]
  grace_period = "5s"
  interval = "30s"
  method = "GET"
  path = "/health"
  timeout = "5s"
