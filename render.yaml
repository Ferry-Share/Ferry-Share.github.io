# One-click relay deploy on Render (free tier is enough).
# In the Render dashboard: New → Blueprint → point it at this repo.
#
# `--omit=dev` installs `ws` alone: the front end is a static export served
# from GitHub Pages, so none of the build toolchain is needed here.
services:
  - type: web
    name: ferry-relay
    runtime: node
    plan: free
    buildCommand: npm ci --omit=dev
    startCommand: node server/relay.js
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: "22"
