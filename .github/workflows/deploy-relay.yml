name: Deploy the relay to Cloudflare

# The relay is the one always-on piece Ferry needs, and GitHub Pages cannot be
# it. This deploys the Worker in `worker/` from a runner, so nobody has to
# install wrangler or hold Cloudflare credentials on their own machine.
#
# One-time setup: add a repository secret named CLOUDFLARE_API_TOKEN
# (Settings → Secrets and variables → Actions → Secrets), created from
# Cloudflare's "Edit Cloudflare Workers" template. That template already
# carries the Workers Scripts and Durable Objects permissions this needs.
# A secret is write-only — it is never printed in a log and cannot be read
# back out, which is why it belongs here rather than pasted into a chat.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "worker/**"
      - "wrangler.toml"
      - ".github/workflows/deploy-relay.yml"

permissions:
  contents: read

concurrency:
  group: deploy-relay
  cancel-in-progress: false

jobs:
  deploy:
    name: wrangler deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # wrangler's own failure for a bad credential is "Invalid format for
      # Authorization header [code: 6111]", which does not say what to fix.
      # These checks name the actual problem. None of them ever print the
      # token: only its length and shape.
      - name: Check the API token
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::CLOUDFLARE_API_TOKEN is not set. Create a token from Cloudflare's 'Edit Cloudflare Workers' template and add it under Settings -> Secrets and variables -> Actions -> Secrets."
            exit 1
          fi

          case "$CLOUDFLARE_API_TOKEN" in
            Bearer*)
              echo "::error::CLOUDFLARE_API_TOKEN begins with 'Bearer'. Store the token on its own; wrangler adds the scheme."
              exit 1
              ;;
          esac

          raw=${#CLOUDFLARE_API_TOKEN}
          stripped=$(printf '%s' "$CLOUDFLARE_API_TOKEN" | tr -d '[:space:]')
          if [ "$raw" -ne "${#stripped}" ]; then
            echo "::error::CLOUDFLARE_API_TOKEN contains whitespace ($raw characters, ${#stripped} without it). A stray newline or space cannot go in an Authorization header, which is exactly what error 6111 reports. Re-add the secret with nothing before or after the token."
            exit 1
          fi

          if printf '%s' "$CLOUDFLARE_API_TOKEN" | grep -qE '^[0-9a-f]{37}$'; then
            echo "::error::That is a Global API Key (37 hex characters), not an API Token. They are different credentials and wrangler wants the second. Create one from Cloudflare's 'Edit Cloudflare Workers' template and replace the secret."
            exit 1
          fi

          # Ask Cloudflare directly, so a bad token fails here with a readable
          # reason rather than midway through a deploy. The token goes in a
          # config file rather than the command line, to keep it out of argv.
          printf 'header = "Authorization: Bearer %s"\n' "$CLOUDFLARE_API_TOKEN" > .curlrc

          verify() {
            curl -sS --config .curlrc -o verify.json -w '%{http_code}' "$1" || echo 000
          }

          # Cloudflare issues two kinds of token and each is verified in its
          # own place. A user token (My Profile -> API Tokens, which is what
          # the "Edit Cloudflare Workers" template creates) answers on /user;
          # an account-owned token answers only on its account. Checking just
          # the first would call a perfectly good account token invalid.
          status=$(verify https://api.cloudflare.com/client/v4/user/tokens/verify)
          scope="user"

          if [ "$status" != "200" ] && [ -n "$CLOUDFLARE_ACCOUNT_ID" ]; then
            status=$(verify "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/tokens/verify")
            scope="account"
          fi
          rm -f .curlrc

          if [ "$status" != "200" ]; then
            echo "::error::Cloudflare rejected the token (HTTP $status on the $scope endpoint). Its reply:"
            cat verify.json || true
            echo
            if [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
              echo "::notice::Only the user endpoint was tried. If this is an account-owned token, also set the CLOUDFLARE_ACCOUNT_ID secret so it can be checked against its account."
            fi
            echo "::error::Create the token from Cloudflare's 'Edit Cloudflare Workers' template, under My Profile -> API Tokens. It must be an API Token — not the Global API Key, not the account id, and not an R2 token, which carries object-storage permissions and cannot deploy a Worker."
            exit 1
          fi

          echo "Token accepted by Cloudflare (verified as a $scope token)."

      # The Worker has no dependencies of its own, so this is wrangler alone.
      # Pinned to a major version: an unpinned tool that deploys to production
      # can change under you between one run and the next.
      - name: Deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -o pipefail
          npx --yes wrangler@4 deploy 2>&1 | tee deploy.log

      - name: Report the relay address
        run: |
          url=$(grep -oE 'https://[a-z0-9._-]+\.workers\.dev' deploy.log | head -1)
          {
            echo "## Relay deployed"
            echo
            if [ -n "$url" ]; then
              echo "Relay address to give Ferry:"
              echo
              echo '```'
              echo "wss://${url#https://}/ws"
              echo '```'
              echo
              echo "To hand it to every visitor rather than configuring each browser:"
              echo "set \`NEXT_PUBLIC_RELAY_URL\` to that address under"
              echo "**Settings → Secrets and variables → Actions → Variables**,"
              echo "then re-run **Deploy to GitHub Pages**."
            else
              echo "Deployed, but wrangler's output carried no workers.dev URL to report."
              echo "Check the deploy step's log, or the Workers dashboard, for the address."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
