name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Work out the base path
        id: base
        run: |
          # A project site lives at /<repo>. A user or org site lives at the
          # root. GitHub does not promise the casing of either name, and
          # getting this wrong sends every asset URL to a 404, so compare the
          # two case-insensitively.
          repo=$(echo "${{ github.event.repository.name }}" | tr '[:upper:]' '[:lower:]')
          owner=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          if [[ "$repo" == "$owner.github.io" ]]; then
            echo "path=" >> "$GITHUB_OUTPUT"
          else
            echo "path=/${{ github.event.repository.name }}" >> "$GITHUB_OUTPUT"
          fi

      - run: npm ci

      # Publishing a broken bundle to Pages is visible to everyone
      # immediately, so it has to pass the same gate as a pull request.
      - run: npm run lint
      - run: npm run typecheck

      - run: npm run build
        env:
          NEXT_PUBLIC_BASE_PATH: ${{ steps.base.outputs.path }}
          # Set this under Settings → Secrets and variables → Actions → Variables.
          # Example: wss://ferry-relay.onrender.com/ws
          NEXT_PUBLIC_RELAY_URL: ${{ vars.NEXT_PUBLIC_RELAY_URL }}

      - run: npm test

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
